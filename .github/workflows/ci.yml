name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # GitHub jobs run on isolated VMs, so fixed /tmp paths remain job-local.
  XDG_DATA_HOME: /tmp/sudoku-data
  XDG_STATE_HOME: /tmp/sudoku-state

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Deployment service contract
        run: python3 scripts/check_deployment.py

      - name: Test with package coverage
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Package coverage summary
        run: python3 scripts/coverage_report.py coverage.out >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report tests
        run: python3 -m unittest scripts/test_coverage_report.py

      - name: Trusted release contract tests
        run: python3 -m unittest scripts/test_package_release.py

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Race detection
        run: go test -race -count=1 ./...

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: API contract and generated code
        run: scripts/check-api-contract.sh

      - name: API compatibility
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${GITHUB_BASE_REF}:api/openapi.yaml" > /tmp/openapi-base.yaml
          go run github.com/tufin/oasdiff@v1.10.0 breaking /tmp/openapi-base.yaml api/openapi.yaml

  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: HTTP API end-to-end
        run: |
          go build -o sudoku .
          python3 scripts/e2e_api.py ./sudoku

  tui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: TUI end-to-end
        run: |
          go build -o sudoku .
          python3 scripts/e2e_tui.py ./sudoku

  cli-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Line CLI and command end-to-end
        run: |
          go build -o sudoku .
          python3 scripts/e2e_cli.py ./sudoku

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest


  trusted-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [unit, race, vet, api-contract, api-e2e, tui-e2e, cli-e2e, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Linux API binary
        run: go build -trimpath -o build/sudoku .
      - name: Package and verify trusted artifact
        run: |
          python3 scripts/package_release.py create \
            --binary build/sudoku \
            --output build/release \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-backend-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
