openapi: 3.1.1
info:
  title: Sudoku HTTP API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  summary: Authoritative guest and account Sudoku games over HTTP
  description: |
    The Sudoku HTTP API exposes the existing game engine through sealed guest
    documents and owner-scoped account games. The server is authoritative for
    state, revisions, validation, and authenticated persistence.

    The server listens on loopback by default behind a trusted deployment
    boundary. Guest documents and application sessions provide the gameplay
    ownership boundaries.
servers:
  - url: http://127.0.0.1:8080
    description: Default loopback deployment

tags:
  - name: Health
    description: Payload-free process health
  - name: Guest
    description: Stateless sealed guest games
  - name: Authentication
    description: Google OIDC and revocable application sessions
  - name: Account
    description: Authenticated account profile and lifecycle
  - name: Account Games
    description: Owner-scoped durable games

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process health
      security: []
      responses:
        "200":
          description: The process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: healthy
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/guest/games:
    post:
      tags: [Guest]
      operationId: createGuestGame
      summary: Create one stateless sealed guest game
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: A replacement-ready sealed guest document and authoritative state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestGame"
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/guest/games/actions:
    post:
      tags: [Guest]
      operationId: applyGuestAction
      summary: Apply one action to a sealed guest game
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestActionRequest"
      responses:
        "200":
          description: A replacement sealed document and authoritative transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestActionResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/GuestRevisionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/guest/games/hint:
    post:
      tags: [Guest]
      operationId: previewGuestHint
      summary: Preview a hint for a sealed guest game without mutation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestHintRequest"
      responses:
        "200":
          description: A complete hint plan for the document's current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/google/start:
    get:
      tags: [Authentication]
      operationId: beginGoogleLogin
      summary: Begin a single-use Google OIDC login
      security: []
      parameters:
        - name: return_to
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "303":
          description: Redirect to Google authorization.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleLogin
      summary: Complete Google OIDC and rotate the application session
      security: []
      parameters:
        - { $ref: "#/components/parameters/OptionalSessionCookie" }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "303":
          description: Set the application-session cookie, then return to the allowlisted path.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              required: true
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAccount
      summary: Revoke the current application session
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: The current session is revoked and cookies are cleared.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account:
    get:
      tags: [Account]
      operationId: getCurrentAccount
      summary: Read the authenticated account profile
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OptionalSessionCookie" }]
      responses:
        "200":
          description: Current application account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Account]
      operationId: deleteCurrentAccount
      summary: Delete the account, sessions, and owned games
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Account-private data was deleted, the current cookie was cleared, and shared puzzles remain.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/sessions/revoke:
    post:
      tags: [Authentication]
      operationId: revokeAccountSessions
      summary: Revoke all application sessions for the account
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204":
          description: Every account session is revoked and the current cookie is cleared.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games:
    get:
      tags: [Account Games]
      operationId: listAccountGames
      summary: List games owned by the authenticated account
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionCookie" }]
      responses:
        "200":
          description: Most recently updated account games.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGameList" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Account Games]
      operationId: deleteAllAccountGames
      summary: Delete every game owned by the authenticated account
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Every owned game was deleted. }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Account Games]
      operationId: createAccountGame
      summary: Create an account-owned game
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGameRequest" }
      responses:
        "201":
          description: Durable owner-scoped game.
          headers:
            Location:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGame" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games/claim:
    post:
      tags: [Account Games]
      operationId: claimGuestGame
      summary: Idempotently claim one sealed guest game
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimGuestGameRequest" }
      responses:
        "200":
          description: Existing durable game returned for a same-owner retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGame" }
        "201":
          description: The guest game became an account game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGame" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games/{accountGameId}:
    parameters: [{ $ref: "#/components/parameters/AccountGameId" }]
    get:
      tags: [Account Games]
      operationId: getAccountGame
      summary: Read one owner-scoped account game
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionCookie" }]
      responses:
        "200":
          description: Current durable game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGame" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "404": { $ref: "#/components/responses/AccountGameNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Account Games]
      operationId: deleteAccountGame
      summary: Delete one owner-scoped account game
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The owned game was deleted. }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AccountGameNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games/{accountGameId}/presentation:
    parameters: [{ $ref: "#/components/parameters/AccountGameId" }]
    put:
      tags: [Account Games]
      operationId: updateAccountGamePresentation
      summary: Persist owner-scoped elapsed presentation time
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountGamePresentationRequest" }
      responses:
        "200":
          description: Current durable game with monotonic elapsed time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGame" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AccountGameNotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games/{accountGameId}/actions:
    parameters: [{ $ref: "#/components/parameters/AccountGameId" }]
    post:
      tags: [Account Games]
      operationId: applyAccountGameAction
      summary: Apply one revisioned action to an owner-scoped game
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionCookie" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: Persisted authoritative transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountActionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AccountGameNotFound" }
        "409": { $ref: "#/components/responses/AccountRevisionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/account/games/{accountGameId}/hint:
    parameters: [{ $ref: "#/components/parameters/AccountGameId" }]
    get:
      tags: [Account Games]
      operationId: previewAccountGameHint
      summary: Preview a hint for an owner-scoped game without mutation
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionCookie" }]
      responses:
        "200":
          description: A complete hint plan for the game's current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintPreview"
        "401": { $ref: "#/components/responses/AccountUnauthorized" }
        "404": { $ref: "#/components/responses/AccountGameNotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sudoku_session
      description: Opaque HttpOnly application-session verifier.

  parameters:
    SessionCookie:
      name: sudoku_session
      in: cookie
      required: true
      schema: { type: string, minLength: 43, maxLength: 128 }
    OptionalSessionCookie:
      name: sudoku_session
      in: cookie
      required: false
      schema: { type: string, minLength: 43, maxLength: 128 }
    CsrfToken:
      name: X-Sudoku-CSRF
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 128 }
      description: Request proof bound to the current application session.
    AccountGameId:
      name: accountGameId
      in: path
      required: true
      schema: { type: string, pattern: '^ag_[a-f0-9]{32}$' }
  responses:
    AccountUnauthorized:
      description: The application session cookie is missing, invalid, revoked, or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Same-origin or CSRF request proof failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountGameNotFound:
      description: The game is absent or not owned by the authenticated account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Account routes are not configured for this runtime.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GuestRevisionConflict:
      description: The sealed guest document revision is stale.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClaimConflict:
      description: The guest document was already claimed by a different account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountRevisionConflict:
      description: The expected account-game revision is stale.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccountRevisionConflict" }
    BadRequest:
      description: The request is malformed or violates the transport contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid-request
              message: { id: error.invalid-request, arguments: [], text: The request is invalid. }
              field: source
    PayloadTooLarge:
      description: The request exceeds the configured body limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload-too-large
              message: { id: error.payload-too-large, arguments: [], text: The request is too large. }
    UnsupportedMediaType:
      description: The request Content-Type is not supported by this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported-media-type
              message: { id: error.unsupported-media-type, arguments: [], text: The request Content-Type is not supported. }
    UnprocessableEntity:
      description: The request is well formed but cannot be applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            engineRejection:
              value:
                error:
                  code: immutable-cell
                  message: { id: error.immutable-cell, arguments: [], text: A given cell cannot be changed. }
                  cell:
                    row: 1
                    column: 3
            invalidSession:
              value:
                error:
                  code: invalid-session
                  message: { id: error.invalid-session, arguments: [], text: The game session is invalid. }
    InternalError:
      description: An unexpected or durability failure occurred without leaking internals.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal-error
              message: { id: error.internal-error, arguments: [], text: The request could not be completed. }

  schemas:
    SealedGuestDocument:
      type: string
      minLength: 1
      maxLength: 2097152

    GuestGame:
      type: object
      additionalProperties: false
      required: [document, revision, actual_difficulty, snapshot]
      properties:
        document: { $ref: "#/components/schemas/SealedGuestDocument" }
        revision: { $ref: "#/components/schemas/Revision" }
        actual_difficulty: { $ref: "#/components/schemas/Difficulty" }
        snapshot: { $ref: "#/components/schemas/Snapshot" }

    GuestActionRequest:
      type: object
      additionalProperties: false
      required: [document, action]
      properties:
        document: { $ref: "#/components/schemas/SealedGuestDocument" }
        action: { $ref: "#/components/schemas/ActionRequest" }

    GuestHintRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/SealedGuestDocument" }

    GuestActionResponse:
      type: object
      additionalProperties: false
      required: [document, revision, actual_difficulty, snapshot, result]
      properties:
        document: { $ref: "#/components/schemas/SealedGuestDocument" }
        revision: { $ref: "#/components/schemas/Revision" }
        actual_difficulty: { $ref: "#/components/schemas/Difficulty" }
        snapshot: { $ref: "#/components/schemas/Snapshot" }
        result: { $ref: "#/components/schemas/ActionResult" }

    Account:
      type: object
      additionalProperties: false
      required: [email, display_name, csrf_token]
      properties:
        email: { type: string, maxLength: 320 }
        display_name: { type: string, maxLength: 200 }
        csrf_token: { type: string, minLength: 43, maxLength: 128 }

    AccountGameSummary:
      type: object
      additionalProperties: false
      required: [id, revision, actual_difficulty, status, elapsed_seconds, updated_at]
      properties:
        id: { type: string, pattern: '^ag_[a-f0-9]{32}$' }
        revision: { $ref: "#/components/schemas/Revision" }
        actual_difficulty: { $ref: "#/components/schemas/Difficulty" }
        status: { $ref: "#/components/schemas/GameStatus" }
        elapsed_seconds: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }

    AccountGameList:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AccountGameSummary" }

    AccountGame:
      type: object
      additionalProperties: false
      required: [id, revision, actual_difficulty, elapsed_seconds, snapshot]
      properties:
        id: { type: string, pattern: '^ag_[a-f0-9]{32}$' }
        revision: { $ref: "#/components/schemas/Revision" }
        actual_difficulty: { $ref: "#/components/schemas/Difficulty" }
        elapsed_seconds: { type: integer, format: int64, minimum: 0 }
        snapshot: { $ref: "#/components/schemas/Snapshot" }

    AccountGamePresentationRequest:
      type: object
      additionalProperties: false
      required: [elapsed_seconds]
      properties:
        elapsed_seconds: { type: integer, format: int64, minimum: 0 }

    ClaimGuestGameRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/SealedGuestDocument" }

    AccountActionResponse:
      type: object
      additionalProperties: false
      required: [game, result]
      properties:
        game: { $ref: "#/components/schemas/AccountGame" }
        result: { $ref: "#/components/schemas/ActionResult" }

    AccountRevisionConflict:
      type: object
      additionalProperties: false
      required: [error, current_revision]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
        current_revision: { $ref: "#/components/schemas/Revision" }

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: healthy

    Revision:
      type: integer
      format: int64
      minimum: 0

    Difficulty:
      type: string
      enum: [easy, medium, hard, expert, evil]

    GameStatus:
      type: string
      enum: [in-progress, invalid, solved]

    ActionKind:
      type: string
      enum:
        - set-value
        - clear-value
        - reset
        - restart
        - undo
        - redo
        - apply-hint
        - set-candidates
        - repair
        - solve

    ErrorCode:
      type: string
      enum:
        - invalid-request
        - invalid-json
        - unsupported-media-type
        - payload-too-large
        - unauthorized
        - forbidden-origin
        - session-not-found
        - revision-conflict
        - invalid-session
        - invalid-action
        - invalid-cell
        - immutable-cell
        - note-not-allowed
        - no-undo
        - no-redo
        - no-hint
        - stale-hint
        - persistence-failed
        - internal-error
        - account-unavailable
        - account-unauthorized
        - csrf-failed
        - account-game-not-found
        - guest-revision-conflict
        - guest-claim-conflict

    CellPosition:
      type: object
      additionalProperties: false
      required: [row, column]
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9

    Digit:
      type: integer
      minimum: 1
      maximum: 9

    CellValue:
      type: integer
      minimum: 0
      maximum: 9
      description: Zero represents an empty cell.

    DigitSet:
      type: array
      minItems: 0
      maxItems: 9
      uniqueItems: true
      items:
        $ref: "#/components/schemas/Digit"

    ValueRow:
      type: array
      minItems: 9
      maxItems: 9
      items:
        $ref: "#/components/schemas/CellValue"

    ValueGrid:
      type: array
      minItems: 9
      maxItems: 9
      items:
        $ref: "#/components/schemas/ValueRow"

    BooleanRow:
      type: array
      minItems: 9
      maxItems: 9
      items:
        type: boolean

    BooleanGrid:
      type: array
      minItems: 9
      maxItems: 9
      items:
        $ref: "#/components/schemas/BooleanRow"

    DigitSetRow:
      type: array
      minItems: 9
      maxItems: 9
      items:
        $ref: "#/components/schemas/DigitSet"

    DigitSetGrid:
      type: array
      minItems: 9
      maxItems: 9
      items:
        $ref: "#/components/schemas/DigitSetRow"

    Snapshot:
      type: object
      additionalProperties: false
      required:
        - givens
        - values
        - invalid
        - candidates
        - mistakes
        - status
        - can_undo
        - can_redo
      properties:
        givens:
          $ref: "#/components/schemas/ValueGrid"
        values:
          $ref: "#/components/schemas/ValueGrid"
        invalid:
          $ref: "#/components/schemas/BooleanGrid"
        candidates:
          $ref: "#/components/schemas/DigitSetGrid"
        mistakes:
          type: integer
          minimum: 0
          description: Count of server-confirmed invalid value submissions in this session.
        status:
          $ref: "#/components/schemas/GameStatus"
        can_undo:
          type: boolean
        can_redo:
          type: boolean

    CreateGameRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          oneOf:
            - $ref: "#/components/schemas/DifficultySource"
            - $ref: "#/components/schemas/PuzzleSource"
          discriminator:
            propertyName: kind
            mapping:
              difficulty: "#/components/schemas/DifficultySource"
              puzzle: "#/components/schemas/PuzzleSource"

    DifficultySource:
      type: object
      additionalProperties: false
      required: [kind, difficulty]
      properties:
        kind:
          type: string
          const: difficulty
        difficulty:
          $ref: "#/components/schemas/Difficulty"

    PuzzleSource:
      type: object
      additionalProperties: false
      required: [kind, puzzle]
      properties:
        kind:
          type: string
          const: puzzle
        puzzle:
          type: string
          minLength: 81
          maxLength: 81
          pattern: ^[0-9.]{81}$
          description: An 81-cell puzzle; dot or zero represents an empty cell.

    MessageDescriptor:
      type: object
      additionalProperties: false
      required: [id, arguments, text]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
          maxLength: 200
        arguments:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/MessageArgument"
        text:
          type: string
          minLength: 1
          maxLength: 4096

    MessageArgument:
      oneOf:
        - $ref: "#/components/schemas/MessageTextArgument"
        - $ref: "#/components/schemas/MessageIntegerArgument"
        - $ref: "#/components/schemas/MessageDigitArgument"
        - $ref: "#/components/schemas/MessageCellArgument"
        - $ref: "#/components/schemas/MessageCandidateArgument"
        - $ref: "#/components/schemas/MessageRowArgument"
        - $ref: "#/components/schemas/MessageColumnArgument"
        - $ref: "#/components/schemas/MessageBoxArgument"
        - $ref: "#/components/schemas/MessageDifficultyArgument"
        - $ref: "#/components/schemas/MessageStrategyArgument"
        - $ref: "#/components/schemas/MessageCountArgument"
        - $ref: "#/components/schemas/MessageDigitsArgument"
        - $ref: "#/components/schemas/MessageCellsArgument"
        - $ref: "#/components/schemas/MessageCandidatesArgument"
        - $ref: "#/components/schemas/MessageUnitsArgument"
      discriminator:
        propertyName: kind
        mapping:
          text: "#/components/schemas/MessageTextArgument"
          integer: "#/components/schemas/MessageIntegerArgument"
          digit: "#/components/schemas/MessageDigitArgument"
          cell: "#/components/schemas/MessageCellArgument"
          candidate: "#/components/schemas/MessageCandidateArgument"
          row: "#/components/schemas/MessageRowArgument"
          column: "#/components/schemas/MessageColumnArgument"
          box: "#/components/schemas/MessageBoxArgument"
          difficulty: "#/components/schemas/MessageDifficultyArgument"
          strategy: "#/components/schemas/MessageStrategyArgument"
          count: "#/components/schemas/MessageCountArgument"
          digits: "#/components/schemas/MessageDigitsArgument"
          cells: "#/components/schemas/MessageCellsArgument"
          candidates: "#/components/schemas/MessageCandidatesArgument"
          units: "#/components/schemas/MessageUnitsArgument"

    MessageTextArgument:
      type: object
      additionalProperties: false
      required: [name, kind, text]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: text }
        text: { type: string, minLength: 1, maxLength: 1000 }

    MessageIntegerArgument:
      type: object
      additionalProperties: false
      required: [name, kind, integer]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: integer }
        integer: { type: integer }

    MessageDigitArgument:
      type: object
      additionalProperties: false
      required: [name, kind, digit]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: digit }
        digit: { $ref: "#/components/schemas/Digit" }

    MessageCellArgument:
      type: object
      additionalProperties: false
      required: [name, kind, cell]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: cell }
        cell: { $ref: "#/components/schemas/CellPosition" }

    MessageCandidateArgument:
      type: object
      additionalProperties: false
      required: [name, kind, candidate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: candidate }
        candidate:
          type: object
          additionalProperties: false
          required: [cell, digit]
          properties:
            cell: { $ref: "#/components/schemas/CellPosition" }
            digit: { $ref: "#/components/schemas/Digit" }

    MessageRowArgument:
      type: object
      additionalProperties: false
      required: [name, kind, row]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: row }
        row: { type: integer, minimum: 1, maximum: 9 }

    MessageColumnArgument:
      type: object
      additionalProperties: false
      required: [name, kind, column]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: column }
        column: { type: integer, minimum: 1, maximum: 9 }

    MessageBoxArgument:
      type: object
      additionalProperties: false
      required: [name, kind, box]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: box }
        box: { type: integer, minimum: 1, maximum: 9 }

    MessageDifficultyArgument:
      type: object
      additionalProperties: false
      required: [name, kind, difficulty]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: difficulty }
        difficulty: { $ref: "#/components/schemas/Difficulty" }

    MessageStrategyArgument:
      type: object
      additionalProperties: false
      required: [name, kind, strategy]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: strategy }
        strategy:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 100

    MessageCountArgument:
      type: object
      additionalProperties: false
      required: [name, kind, count]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: count }
        count: { type: integer, minimum: 0 }

    MessageDigitsArgument:
      type: object
      additionalProperties: false
      required: [name, kind, digits]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: digits }
        digits:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/Digit" }

    MessageCellsArgument:
      type: object
      additionalProperties: false
      required: [name, kind, cells]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: cells }
        cells:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/CellPosition" }

    MessageCandidatesArgument:
      type: object
      additionalProperties: false
      required: [name, kind, candidates]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: candidates }
        candidates:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HintCandidate" }

    MessageUnitsArgument:
      type: object
      additionalProperties: false
      required: [name, kind, units]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, const: units }
        units:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/HintUnit" }

    HintPlan:
      type: object
      additionalProperties: false
      required: [plan_id, kind, title, summary, steps, conclusion]
      properties:
        plan_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        kind:
          type: string
          enum: [value-correction, candidate-correction, strategy]
        title:
          $ref: "#/components/schemas/MessageDescriptor"
        strategy:
          $ref: "#/components/schemas/HintStrategy"
        summary:
          $ref: "#/components/schemas/MessageDescriptor"
        reason:
          $ref: "#/components/schemas/HintReason"
        steps:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/HintStep"
        conclusion:
          $ref: "#/components/schemas/HintEffect"

    HintReason:
      oneOf:
        - $ref: "#/components/schemas/SubsetReservationReason"
        - $ref: "#/components/schemas/HiddenSubsetConfinementReason"
        - $ref: "#/components/schemas/FishConfinementReason"
        - $ref: "#/components/schemas/ImplicationChainReason"
      discriminator:
        propertyName: kind
        mapping:
          subset-reservation: "#/components/schemas/SubsetReservationReason"
          hidden-subset-confinement: "#/components/schemas/HiddenSubsetConfinementReason"
          fish-confinement: "#/components/schemas/FishConfinementReason"
          implication-chain: "#/components/schemas/ImplicationChainReason"

    HintUnit:
      type: object
      additionalProperties: false
      required: [kind, index]
      properties:
        kind: { type: string, enum: [row, column, box] }
        index: { type: integer, minimum: 1, maximum: 9 }

    HintCandidate:
      type: object
      additionalProperties: false
      required: [cell, digit]
      properties:
        cell: { $ref: "#/components/schemas/CellPosition" }
        digit: { $ref: "#/components/schemas/Digit" }

    HintCandidateGroup:
      type: object
      additionalProperties: false
      required: [cell, digits]
      properties:
        cell: { $ref: "#/components/schemas/CellPosition" }
        digits:
          type: array
          minItems: 2
          maxItems: 9
          items: { $ref: "#/components/schemas/Digit" }

    HintCandidateLink:
      type: object
      additionalProperties: false
      required: [from, to, kind]
      properties:
        from: { $ref: "#/components/schemas/HintCandidate" }
        to: { $ref: "#/components/schemas/HintCandidate" }
        kind: { $ref: "#/components/schemas/HintLinkKind" }

    SubsetReservationReason:
      type: object
      additionalProperties: false
      required: [kind, unit, reserved_digits, premise_cells, action_targets]
      properties:
        kind: { type: string, const: subset-reservation }
        unit: { $ref: "#/components/schemas/HintUnit" }
        reserved_digits:
          type: array
          minItems: 2
          maxItems: 9
          items: { $ref: "#/components/schemas/Digit" }
        premise_cells:
          type: array
          minItems: 2
          maxItems: 9
          items: { $ref: "#/components/schemas/CellPosition" }
        action_targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HintCandidate" }

    HiddenSubsetConfinementReason:
      type: object
      additionalProperties: false
      required: [kind, unit, confined_digits, premise_cells, action_targets]
      properties:
        kind: { type: string, const: hidden-subset-confinement }
        unit: { $ref: "#/components/schemas/HintUnit" }
        confined_digits:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/Digit" }
        premise_cells:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/CellPosition" }
        action_targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HintCandidate" }

    FishConfinementReason:
      type: object
      additionalProperties: false
      required: [kind, digit, base_units, cover_units, pattern_candidates, action_targets]
      properties:
        kind: { type: string, const: fish-confinement }
        digit: { $ref: "#/components/schemas/Digit" }
        base_units:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/HintUnit" }
        cover_units:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/HintUnit" }
        pattern_candidates:
          type: array
          minItems: 4
          maxItems: 16
          items: { $ref: "#/components/schemas/HintCandidate" }
        action_targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HintCandidate" }

    ImplicationChainReason:
      type: object
      additionalProperties: false
      required: [kind, bivalue_groups, links, endpoint_digit, action_targets]
      properties:
        kind: { type: string, const: implication-chain }
        bivalue_groups:
          type: array
          minItems: 2
          maxItems: 32
          items: { $ref: "#/components/schemas/HintCandidateGroup" }
        links:
          type: array
          minItems: 1
          maxItems: 31
          items: { $ref: "#/components/schemas/HintCandidateLink" }
        endpoint_digit: { $ref: "#/components/schemas/Digit" }
        action_targets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/HintCandidate" }

    HintStrategy:
      type: object
      additionalProperties: false
      required: [id, name, grade, grade_name]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        name:
          $ref: "#/components/schemas/MessageDescriptor"
        grade:
          $ref: "#/components/schemas/Difficulty"
        grade_name:
          $ref: "#/components/schemas/MessageDescriptor"

    HintStepKind:
      type: string
      enum: [observe, explain, apply]

    HintRole:
      type: string
      enum: [focus, premise, eliminated, conclusion, problem, extra]

    HintNarrationChunk:
      oneOf:
        - $ref: "#/components/schemas/HintNarrationMessage"
        - $ref: "#/components/schemas/HintNarrationTarget"
        - $ref: "#/components/schemas/HintNarrationDigit"
      discriminator:
        propertyName: kind
        mapping:
          message: "#/components/schemas/HintNarrationMessage"
          target: "#/components/schemas/HintNarrationTarget"
          digit: "#/components/schemas/HintNarrationDigit"

    HintNarrationMessage:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind:
          type: string
          const: message
        message:
          $ref: "#/components/schemas/MessageDescriptor"

    HintNarrationTarget:
      type: object
      additionalProperties: false
      required: [kind, target]
      properties:
        kind:
          type: string
          const: target
        target:
          $ref: "#/components/schemas/HintTarget"

    HintNarrationDigit:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          const: digit
        value:
          $ref: "#/components/schemas/Digit"

    HintTargetKind:
      type: string
      enum: [cell, candidate, row, column, box]

    HintTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/HintTargetKind"
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9
        value:
          $ref: "#/components/schemas/Digit"
        index:
          type: integer
          minimum: 1
          maximum: 9

    HintMark:
      type: object
      additionalProperties: false
      required: [target, role]
      properties:
        target:
          $ref: "#/components/schemas/HintTarget"
        role:
          $ref: "#/components/schemas/HintRole"

    HintNode:
      type: object
      additionalProperties: false
      required: [id, target]
      properties:
        id:
          type: string
          pattern: ^r[1-9]c[1-9]-v[1-9]$
        target:
          $ref: "#/components/schemas/HintTarget"
        group:
          type: string
          enum: [A, B]
        order:
          type: integer
          minimum: 1
          maximum: 32

    HintLinkKind:
      type: string
      enum: [strong, weak, implication]

    HintLink:
      type: object
      additionalProperties: false
      required: [from, to, kind]
      properties:
        from:
          type: string
          pattern: ^r[1-9]c[1-9]-v[1-9]$
        to:
          type: string
          pattern: ^r[1-9]c[1-9]-v[1-9]$
        kind:
          $ref: "#/components/schemas/HintLinkKind"

    HintPlacement:
      type: object
      additionalProperties: false
      required: [row, column, value]
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9
        value:
          $ref: "#/components/schemas/Digit"

    HintElimination:
      type: object
      additionalProperties: false
      required: [row, column, value]
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9
        value:
          $ref: "#/components/schemas/Digit"

    HintEffect:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [clear-value, set-candidates, place-value, eliminate-candidates]
        placement:
          $ref: "#/components/schemas/HintPlacement"
        eliminations:
          type: array
          maxItems: 729
          items:
            $ref: "#/components/schemas/HintElimination"
        clear_value:
          $ref: "#/components/schemas/CellPosition"
        set_candidates:
          type: object
          additionalProperties: false
          required: [row, column, values]
          properties:
            row:
              type: integer
              minimum: 1
              maximum: 9
            column:
              type: integer
              minimum: 1
              maximum: 9
            values:
              $ref: "#/components/schemas/DigitSet"

    HintStep:
      type: object
      additionalProperties: false
      required: [id, kind, message, marks, nodes, links]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/HintStepKind"
        message:
          $ref: "#/components/schemas/MessageDescriptor"
        narration:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/HintNarrationChunk"
        marks:
          type: array
          maxItems: 729
          items:
            $ref: "#/components/schemas/HintMark"
        nodes:
          type: array
          maxItems: 729
          items:
            $ref: "#/components/schemas/HintNode"
        links:
          type: array
          maxItems: 729
          items:
            $ref: "#/components/schemas/HintLink"
        effect:
          $ref: "#/components/schemas/HintEffect"

    HintPreview:
      type: object
      additionalProperties: false
      required: [revision, hint]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
        hint:
          $ref: "#/components/schemas/HintPlan"

    ActionRequest:
      oneOf:
        - $ref: "#/components/schemas/SetValueAction"
        - $ref: "#/components/schemas/ClearValueAction"
        - $ref: "#/components/schemas/ResetAction"
        - $ref: "#/components/schemas/RestartAction"
        - $ref: "#/components/schemas/UndoAction"
        - $ref: "#/components/schemas/RedoAction"
        - $ref: "#/components/schemas/ApplyHintAction"
        - $ref: "#/components/schemas/SetCandidatesAction"
        - $ref: "#/components/schemas/RepairAction"
        - $ref: "#/components/schemas/SolveAction"
      discriminator:
        propertyName: kind
        mapping:
          set-value: "#/components/schemas/SetValueAction"
          clear-value: "#/components/schemas/ClearValueAction"
          reset: "#/components/schemas/ResetAction"
          restart: "#/components/schemas/RestartAction"
          undo: "#/components/schemas/UndoAction"
          redo: "#/components/schemas/RedoAction"
          apply-hint: "#/components/schemas/ApplyHintAction"
          set-candidates: "#/components/schemas/SetCandidatesAction"
          repair: "#/components/schemas/RepairAction"
          solve: "#/components/schemas/SolveAction"

    SetValueAction:
      type: object
      additionalProperties: false
      required: [expected_revision, kind, row, column, value]
      properties:
        expected_revision:
          $ref: "#/components/schemas/Revision"
        kind:
          type: string
          const: set-value
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9
        value:
          $ref: "#/components/schemas/Digit"

    ClearValueAction:
      type: object
      additionalProperties: false
      required: [expected_revision, kind, row, column]
      properties:
        expected_revision:
          $ref: "#/components/schemas/Revision"
        kind:
          type: string
          const: clear-value
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9

    SetCandidatesAction:
      type: object
      additionalProperties: false
      required: [expected_revision, kind, row, column, values]
      properties:
        expected_revision:
          $ref: "#/components/schemas/Revision"
        kind:
          type: string
          const: set-candidates
        row:
          type: integer
          minimum: 1
          maximum: 9
        column:
          type: integer
          minimum: 1
          maximum: 9
        values:
          $ref: "#/components/schemas/DigitSet"

    ResetAction:
      $ref: "#/components/schemas/NoArgumentResetAction"
    RestartAction:
      $ref: "#/components/schemas/NoArgumentRestartAction"
    UndoAction:
      $ref: "#/components/schemas/NoArgumentUndoAction"
    RedoAction:
      $ref: "#/components/schemas/NoArgumentRedoAction"
    ApplyHintAction:
      type: object
      additionalProperties: false
      required: [expected_revision, kind, plan_id]
      properties:
        expected_revision:
